name: CI

on:
  push:
    branches: [main, melhorias/roadmap-engenharia]
  pull_request:
    branches: [main, melhorias/roadmap-engenharia]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instala uv
        uses: astral-sh/setup-uv@v4

      - name: Instala dependencias (app + dev)
        run: uv pip install --system -r app/requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest

