name: CI

on:
  push:
    branches: [main, melhorias/roadmap-engenharia]
  pull_request:
    branches: [main, melhorias/roadmap-engenharia]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: minerva_test
          POSTGRES_PASSWORD: minerva_ci_only
          POSTGRES_DB: minerva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minerva_test -d minerva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINERVA_TEST_DSN: postgresql://minerva_test:minerva_ci_only@localhost:5432/minerva_test
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instala uv
        uses: astral-sh/setup-uv@v4

      - name: Instala dependencias (app + dev)
        run: uv pip install --system -r app/requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest

